{% extends "base.html" %}
{% import "partials/icons.html" as icon %}
{% block title %} · Log in{% endblock %}
{% block body %}
<div class="app">
  <form class="gate" method="post" action="/login">

    <div class="brand">
      <div class="mark mark--brand">{{ icon.logo(66) }}</div>
      <span>CAMPUS MARKET</span>
    </div>

    <h1>Welcome back</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <span class="cap">Nova e-mail</span>
    <input class="input" name="email" type="email" required inputmode="email"
           autocapitalize="none" autocomplete="email"
           maxlength="{{ EMAIL_MAX }}" pattern="{{ EMAIL_PATTERN }}"
           title="Your {{ EMAIL_DIGITS }} digit student number and {{ EMAIL_DOMAIN }}"
           placeholder="58412{{ EMAIL_DOMAIN }}" value="{{ email or '' }}">

    <span class="cap" style="margin-top: 18px">Password</span>
    <input class="input" name="password" type="password" required
           autocomplete="current-password">

    <div class="again">
      <a class="link" href="/forgot">Forgot your password?</a>
    </div>

    <div class="grow"></div>

    <button class="btn" type="submit">Log in</button>
    <a class="btn btn--quiet" href="/start" style="margin-top: 10px">Back</a>

  </form>
</div>
{% endblock %}
